name: Russian catalog

on:
  pull_request:
    paths:
      - lms/locale/**
      - check-russian-translations.py
      - .github/workflows/russian-catalog.yml
  push:
    branches: [main, russian-localization-2.64]
    paths:
      - lms/locale/**
      - check-russian-translations.py
      - .github/workflows/russian-catalog.yml

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Babel==2.16.0
      - run: python check-russian-translations.py
